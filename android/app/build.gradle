plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "org.osmooperator.app"
    compileSdk 34

    defaultConfig {
        applicationId "org.osmooperator.app"
        minSdk 29
        targetSdk 34
        versionCode 3
        versionName "0.3"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // Pinned to the 5.3 line: the chat and account APIs used here changed in 5.4.
    implementation "org.linphone:linphone-sdk-android:5.3.+"
}
