plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "org.osmooperator.app"
    compileSdk 34

    defaultConfig {
        applicationId "org.osmooperator.app"
        minSdk 29
        targetSdk 34
        versionCode 6
        versionName "0.6"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // Pinned to the 5.3 line: the chat and account APIs used here changed in 5.4.
    implementation "org.linphone:linphone-sdk-android:5.3.+"
    // The frames of the bench: a WebSocket to the dashboard (osmo-egprs-web).
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    // The invitation QR code (osmo-inscription --nouveau-qrcode): Google's code
    // scanner opens the camera itself, no camera permission for the app.
    implementation "com.google.android.gms:play-services-code-scanner:16.1.0"
}
