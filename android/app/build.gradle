plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "org.osmooperator.app"
    compileSdk 34

    defaultConfig {
        applicationId "org.osmooperator.app"
        minSdk 29
        targetSdk 34
        versionCode 17
        versionName "0.10"
        // Les telephones seulement (ARM 64 et 32 bits) : avec x86 et x86_64, qui
        // ne servent qu aux emulateurs, l APK pesait 141 Mo - un telechargement
        // tronque sur le telephone donne « package non valide ».
        ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
    }

    // UNE CLE DE SIGNATURE FIXE, quand elle est fournie (BANC_KEYSTORE, un PKCS#12
    // d alias « banc »). Sans elle, chaque machine de compilation signe avec une
    // cle de debug neuve : Android refuse alors la mise a jour (« package non
    // valide ») et il faut desinstaller, donc se reinscrire. Voir android/cle-signature.sh.
    signingConfigs {
        banc {
            if (System.getenv("BANC_KEYSTORE")) {
                storeFile file(System.getenv("BANC_KEYSTORE"))
                storePassword System.getenv("BANC_KEYSTORE_PASS")
                keyAlias "banc"
                keyPassword System.getenv("BANC_KEYSTORE_PASS")
                storeType "pkcs12"
            }
        }
    }
    buildTypes {
        debug {
            if (System.getenv("BANC_KEYSTORE")) signingConfig signingConfigs.banc
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // Pinned to the 5.3 line: the chat and account APIs used here changed in 5.4.
    implementation "org.linphone:linphone-sdk-android:5.3.+"
    // The frames of the bench: a WebSocket to the dashboard (osmo-egprs-web).
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    // The invitation QR code (osmo-inscription --nouveau-qrcode): Google's code
    // scanner opens the camera itself, no camera permission for the app.
    implementation "com.google.android.gms:play-services-code-scanner:16.1.0"
}
