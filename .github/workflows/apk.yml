name: APK Android

# The Android twin of network-monitor.py (android/). The APK is a build artifact:
# Actions -> this run -> "network-monitor-apk".

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        run: gradle -p android --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: network-monitor-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
